name: CI

# Validate every push and PR: run the BATS suite and build+sanity-check the pkg.
# No publishing here — releases happen only on v* tags (see release.yml).

on:
  push:
  pull_request:

jobs:
  macos:
    name: Test + build pkg
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install bats
        run: brew install bats-core

      - name: Run the BATS suite
        run: make test

      - name: Build the pkg and sanity-check it
        run: |
          VER=$(cat VERSION)
          sh packaging/macos/build_pkg.sh "$VER" "mavericks-signal-desktop-$VER.pkg"
          pkgutil --payload-files "mavericks-signal-desktop-$VER.pkg" | grep -E 'libexec/mavericks-signal-desktop/bin/signal-desktop'
          pkgutil --payload-files "mavericks-signal-desktop-$VER.pkg" | grep -E '/usr/local/bin/signal-desktop$'
          pkgutil --expand "mavericks-signal-desktop-$VER.pkg" /tmp/pkgx
          grep -o 'os-version min="[0-9.]*"' /tmp/pkgx/Distribution

  # 10.9-safety gate for the native Porthole viewer, built through the shared
  # mavericks-shared-cmake conventions: find_package + include(Mavericks) run the
  # AppleClang gate while mavericks_assert_binary_compatible(Porthole) fails the build
  # if the cross-built binary imports a post-10.9 symbol. macos-26 -> cross mode.
  cmake-10_9-gate:
    name: CMake 10.9-safety gate (Porthole via mavericks-shared-cmake)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install mavericks-shared-cmake
        uses: ModernMavericks/shared-cmake/.github/actions/install@v1

      - name: Check out the porthole engine (sibling)
        uses: actions/checkout@v7
        with:
          repository: ModernMavericks/porthole
          path: ../mavericks-porthole

      - name: Ensure Rosetta (the x86_64 @ 10.9 codec test runs under it)
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Configure + build (x86_64 @ 10.9) — compat guard gates Porthole
        run: |
          cmake --preset cross
          cmake --build build-cross-signal-desktop
          echo "Porthole slice:"; lipo -info build-cross-signal-desktop/porthole/viewer/Porthole.app/Contents/MacOS/Porthole

      - name: Off-device codec test (Rosetta)
        run: ctest --preset cross -R '^protocol$' --output-on-failure
